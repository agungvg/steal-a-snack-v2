// ---- colour helpers (same math as the factory's shade()) ----
function rgb(t){ return new THREE.Color(t[0]/255, t[1]/255, t[2]/255); }
function shade(c, f){
  const adj = v => {
    let out = f >= 0 ? v + (1 - v) * f : v * (1 + f);
    return Math.floor(Math.min(235, Math.max(25, out * 255)) + 0.5) / 255;
  };
  return new THREE.Color(adj(c.r), adj(c.g), adj(c.b));
}
const MAT = { Fabric:{rough:0.9, metal:0}, SmoothPlastic:{rough:0.35, metal:0}, Metal:{rough:0.35, metal:0.8}, Leather:{rough:0.7, metal:0}, Neon:{rough:0.4, metal:0, emissive:1} };
function mat(color, kind, transp){
  const m = MAT[kind] || MAT.SmoothPlastic;
  const o = new THREE.MeshStandardMaterial({ color, roughness:m.rough, metalness:m.metal });
  if (transp) { o.transparent = true; o.opacity = 1 - transp; }
  if (m.emissive) { o.emissive = color; o.emissiveIntensity = 0.7; }
  return o;
}

// ---- part helpers (character-local frame: P(fwd, up, right), S(x, y, z)) ----
function ball(group, u, fwd, up, right, sx, sy, sz, color, kind, transp, rx, ry, rz){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), mat(color, kind, transp));
  m.position.set(right*u, up*u, fwd*u);
  m.scale.set(sx*u/2, sy*u/2, sz*u/2);
  if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
  m.castShadow = true; m.receiveShadow = true;
  group.add(m); return m;
}
function box(group, u, fwd, up, right, sx, sy, sz, color, kind, transp, rx, ry, rz){
  const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat(color, kind, transp));
  m.position.set(right*u, up*u, fwd*u);
  m.scale.set(sx*u, sy*u, sz*u);
  if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
  m.castShadow = true; m.receiveShadow = true;
  group.add(m); return m;
}
function cyl(group, u, fwd, up, right, len, dia, color, kind, transp, axis, tilt){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(dia*u/2, dia*u/2, len*u, 20), mat(color, kind, transp));
  m.position.set(right*u, up*u, fwd*u);
  if (axis === 'X') { m.rotation.z = Math.PI/2 + (tilt||0); }
  else if (axis === 'Z') { m.rotation.x = Math.PI/2 + (tilt||0); }
  else if (tilt) { m.rotation.z = tilt; }
  m.castShadow = true; m.receiveShadow = true;
  group.add(m); return m;
}

  for (const side of [-1, 1]){

    ball(g, u, fwd, up + 0.15*s, x, 0.22*s, 0.09*s, 0.10*s, skin, 'Fabric', bodyT);                        // lid

  ball(g, u, fwd + 0.035*s, up - 0.08*s, 0, 0.09*s, 0.07*s, 0.12*s, skin, 'Fabric', bodyT);
  // blush cheeks

    ball(g, u, fwd + 0.01*s, up - 0.21*s,  0.085*s, 0.04*s, 0.04*s, 0.10*s, mc, 'SmoothPlastic');
  } else {
    ball(g, u, fwd + 0.015*s, up - 0.19*s, 0, 0.15*s, 0.035*s, 0.12*s, mc, 'SmoothPlastic');
    ball(g, u, fwd + 0.01*s, up - 0.175*s, -0.085*s, 0.04*s, 0.04*s, 0.10*s, mc, 'SmoothPlastic');
    ball(g, u, fwd + 0.01*s, up - 0.175*s,  0.085*s, 0.04*s, 0.04*s, 0.10*s, mc, 'SmoothPlastic');
  }
}

// ---- floating name label ----
function addLabel(g, u, def){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const c2 = cv.getContext('2d');
  c2.fillStyle = 'rgba(20,20,30,0.72)'; c2.beginPath(); c2.roundRect(6, 6, 500, 116, 18); c2.fill();
  c2.fillStyle = '#ffffff'; c2.font = 'bold 44px system-ui, sans-serif'; c2.textAlign = 'center';
  c2.fillText(def.name, 256, 52);
  c2.fillStyle = '#ffd76a'; c2.font = 'bold 36px system-ui, sans-serif';
  c2.fillText('$' + def.price.toLocaleString() + '  •  $' + def.rate + '/s', 256, 102);
  const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(3.2*u/3, 0.8*u/3, 1); sp.position.set(0, 2.05*u, 0);
  g.add(sp);
}

// ---- build one snack (group at groundPos, facing +Z) ----
function buildSnack(def, groundY){
  const u = def.size;
  const g = new THREE.Group();
  const body = rgb(def.food), bodyHi = shade(body, 0.28), bodyLo = shade(body, -0.30);
  const rarity = RARITY[def.rarity];
  FOOD[def.key](g, u, def, body, bodyHi, bodyLo, 0, rarity);
  // rarity disc under the feet
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.85*u, 0.85*u, 0.06*u, 32), mat(rgb(rarity), 'Neon', 0.35));
  disc.position.y = 0.03*u; disc.receiveShadow = true; g.add(disc);
  addLabel(g, u, def);
  g.position.y = groundY;
  return g;
}

function envMesh(geo, color, kind, x, y, z, sx, sy, sz, ry, rx, rz){
  const m = new THREE.Mesh(geo, mat(color, kind));
  m.position.set(x, y, z); if (sx) m.scale.set(sx, sy, sz);
  if (ry) m.rotation.y = ry; if (rx) m.rotation.x = rx; if (rz) m.rotation.z = rz;

  envMesh(sphGeo, rgb(g), 'Fabric', t[0] + 1.6, 4.4, t[1] + 0.8, 3.2, 2.6, 3.2);
  envMesh(sphGeo, rgb(g), 'Fabric', t[0] - 1.5, 4.6, t[1] - 0.7, 3.0, 2.4, 3.0);
});
// granite fountain in the north gap (-36,-22) + pebble-rim pond in the
// south gap (36,22) — Luau positions, not the old (0,±55) placeholders
envMesh(cylGeo, rgb([150,148,142]), 'Fabric', -36, 0.5, -22, 8, 1, 8); // basin, r=4
envMesh(cylGeo, rgb([120,180,220]), 'SmoothPlastic', -36, 0.65, -22, 7, 0.5, 7); // water
envMesh(cylGeo, rgb([135,132,128]), 'Fabric', -36, 1.4, -22, 1.4, 1.4, 1.4); // column
envMesh(cylGeo, rgb([140,195,230]), 'SmoothPlastic', -36, 2.2, -22, 2.2, 0.25, 2.2); // top water
neonBall(-36, 2.6, -22, 0.4, [150,200,235]); // cool glow orb
halo(-36, 2.6, -22, 2.4, [150,200,235]);
for (let b = 0; b < 4; b++){
  const a = b * Math.PI/2 + 0.4;
  envMesh(sphGeo, rgb([72,126,58]), 'Fabric', -36 + Math.cos(a)*5.2, 0.55, -22 + Math.sin(a)*5.2, 1.4, 1.1, 1.4);
}
envMesh(cylGeo, rgb([110,175,165]), 'SmoothPlastic', 36, 0.2, 22, 9, 0.4, 9); // pond water, r=4.5
for (let s = 0; s < 8; s++){
  const a = s * Math.PI/4;
  envMesh(sphGeo, rgb([130,125,118]), 'Fabric', 36 + Math.cos(a)*4.6, 0.45, 22 + Math.sin(a)*4.6, 1.1, 1.1, 1.1);
}
for (let l = 0; l < 3; l++){
  const a = (l + 1) * 2.1;
  const px = 36 + Math.cos(a)*2.2, pz = 22 + Math.sin(a)*2.2;
  envMesh(cylGeo, rgb([80,140,70]), 'Fabric', px, 0.42, pz, 1.3, 0.12, 1.3); // lily pad
  envMesh(sphGeo, rgb(FLOWER_COLORS[l]), 'SmoothPlastic', px, 0.6, pz, 0.3, 0.3, 0.3); // lily flower
}

// ---- plaza lights + ground life (Bases.luau: 6 lamp posts, 4 string
// spans, belt flower beds, boulder clusters, feature paths) ----
const LAMP_WARM = [255,167,87];
[[-56,-8],[0,-8],[56,-8],[-56,8],[0,8],[56,8]].forEach((p, n) => {
  const x = p[0], z = p[1], dir = z < 0 ? 1 : -1; // arm reaches toward the belt
  envMesh(boxGeo, rgb([140,135,128]), 'Fabric', x, 0.3, z, 1.2, 0.6, 1.2); // stone base
  envMesh(boxGeo, rgb([55,55,60]), 'Metal', x, 3.5, z, 0.35, 7, 0.35); // pole
  envMesh(boxGeo, rgb([55,55,60]), 'Metal', x, 6.8, z + dir*0.6, 0.25, 0.25, 1.4); // arm
  envMesh(boxGeo, rgb([55,55,60]), 'Metal', x, 6.6, z + dir*1.2, 0.12, 0.5, 0.12); // rod
  envMesh(boxGeo, rgb([55,55,60]), 'Metal', x, 7.1, z, 0.9, 0.25, 0.9); // cap
  neonBall(x, 6.2, z + dir*1.2, 0.7, LAMP_WARM); // warm glowing bulb
  halo(x, 6.2, z + dir*1.2, 3.2, LAMP_WARM);
  const pl = new THREE.PointLight(rgb(LAMP_WARM), 1.2, 18, 1);
  pl.position.set(x, 6.2, z + dir*1.2); scene.add(pl);
});
// string lights: 4 catenary spans between the lamp posts, 7 bulbs each,
// sagging 1.3 studs at mid-span (base y=7.0), colours cycle gold/pink/cyan/white
const STRING_COLORS = [[255,200,100],[255,150,180],[140,220,255],[255,240,200]];
[[1,-56,0,-8],[2,0,56,-8],[3,-56,0,8],[4,0,56,8]].forEach((sp) => {
  const x1 = sp[1], x2 = sp[2], z = sp[3];
  const mid = (x1 + x2)/2, half = (x2 - x1)/2;
  const sagY = (x) => { const u = (x - mid)/half; return 7.0 - 1.3*(1 - u*u); };
  const pts = [[x1, 7.0]];
  for (let b = 1; b <= 7; b++) pts.push([x1 + 7*b, sagY(x1 + 7*b)]);
  pts.push([x2, 7.0]);
  for (let b = 1; b <= 7; b++){
    const col = STRING_COLORS[(b - 1) % 4];
    neonBall(pts[b][0], pts[b][1], z, 0.35, col);
    halo(pts[b][0], pts[b][1], z, 1.3, col);
  }
  for (let s = 0; s < pts.length - 1; s++){
    beam(pts[s][0], pts[s][1], pts[s+1][0], pts[s+1][1], z, [40,38,36]);
  }
});
// belt flower beds at (±36, ±5.5)
[[-36,-5.5],[36,-5.5],[-36,5.5],[36,5.5]].forEach((spot, bi) => {
  const bx = spot[0], bz = spot[1];
  envMesh(boxGeo, rgb([90,65,45]), 'Fabric', bx, 0.175, bz, 4, 0.35, 1.2);
  for (let f = 0; f < 3; f++){
    const fx = bx - 1.2 + f*1.2;
    envMesh(boxGeo, rgb([70,110,55]), 'Fabric', fx, 0.65, bz, 0.12, 0.6, 0.12);
    envMesh(sphGeo, rgb(FLOWER_COLORS[(bi + f) % 5]), 'SmoothPlastic', fx, 1.0, bz, 0.35, 0.35, 0.35);
  }
});
// boulder clusters on the outer grass
[[-95,0],[95,0],[0,-62]].forEach((cl) => {
  [2.2, 1.5, 1.1].forEach((s, j) => {
    envMesh(sphGeo, rgb([130,128,122]), 'Fabric', cl[0] + (j - 1)*1.6, s*0.4, cl[1] + (j % 2)*1.2, s, s*0.8, s);
  });
});
// cobble paths belt -> fountain and belt -> pond
for (let p = 0; p < 4; p++){
  envMesh(boxGeo, rgb([138,132,120]), 'Fabric', -36, 0.06, -5 - p*3.2, 4, 0.12, 3);
  envMesh(boxGeo, rgb([138,132,120]), 'Fabric', 36, 0.06, 5 + p*3.2, 4, 0.12, 3);
}

// ---- carnival: ferris wheel (-92,15) + tower (95,-25) ----
// (Bases.luau buildFerrisWheel / buildTower; both stand in the
// background, outside the play area)
const RAINBOW = [[255,80,80],[255,200,60],[90,220,110],[90,200,255],[180,120,255],[255,130,190]];
(function(){
  const hx = -92, hy = 17, hz = 15, R = 12.5;
  envMesh(boxGeo, rgb([140,135,128]), 'Fabric', hx, 0.25, hz, 8, 0.5, 16); // platform
  // A-frame legs: base (hx, 0, hz±7.5) to hub, tilted about X
  for (const s of [-1, 1]){
    envMesh(boxGeo, rgb([70,70,78]), 'Metal', hx, 8.5, hz + s*3.75, 0.9, 18.6, 0.9, 0, -s*0.419);
  }
  envMesh(boxGeo, rgb([70,70,78]), 'Metal', hx, 8.5, hz, 0.7, 0.7, 15); // crossbar
  // hub: cylinder along X + gold neon orb
  envMesh(cylGeo, rgb([55,55,60]), 'Metal', hx, hy, hz, 2.4, 1.2, 2.4, 0, 0, Math.PI/2);
  neonBall(hx, hy, hz, 1.2, RAINBOW[1]);
  halo(hx, hy, hz, 3.0, RAINBOW[1]);
  // rim: 12 rainbow neon segments (dodecagon) + 12 bulbs at the vertices
  for (let i = 1; i <= 12; i++){
    const a = (i - 0.5) * Math.PI/6;
    neonMesh(boxGeo, RAINBOW[(i - 1) % 6], hx, hy + Math.cos(a)*R, hz + Math.sin(a)*R, 0.5, 6.6, 0.5, a + Math.PI/2, 0, 0);
    const v = (i - 1) * Math.PI/6;
    neonBall(hx, hy + Math.cos(v)*R, hz + Math.sin(v)*R, 0.55, RAINBOW[(i + 2) % 6]);
    halo(hx, hy + Math.cos(v)*R, hz + Math.sin(v)*R, 1.1, RAINBOW[(i + 2) % 6]);
  }
  // spokes: 8 radial metal bars, hub to rim
  for (let i = 1; i <= 8; i++){
    const a = (i - 1) * Math.PI/4;
    envMesh(boxGeo, rgb([90,90,100]), 'Metal', hx, hy + Math.cos(a)*(R/2), hz + Math.sin(a)*(R/2), 0.35, R, 0.35, 0, a);
  }
  // cabins: 8 colourful cars on the rim + a neon bulb each
  const cabinColors = [[255,90,90],[255,200,60],[90,220,110],[90,200,255],[180,120,255],[255,130,190],[255,150,60],[120,255,200]];
  for (let i = 1; i <= 8; i++){
    const a = (i - 1) * Math.PI/4 + Math.PI/8;
    const cy = hy + Math.cos(a)*11, cz = hz + Math.sin(a)*11;
    envMesh(boxGeo, rgb(cabinColors[i - 1]), 'Fabric', hx, cy, cz, 2.4, 2.2, 2.2);
    neonBall(hx, cy + 1.3, cz, 0.4, RAINBOW[(i - 1) % 6]);
  }
  // pennant flags on the platform corners
  for (const sx of [-1, 1]) for (const sz of [-1, 1]){
    const px = hx + sx*3.5, pz = hz + sz*7;
    envMesh(boxGeo, rgb([110,78,48]), 'Fabric', px, 1.75, pz, 0.2, 3.5, 0.2);
    envMesh(boxGeo, rgb(RAINBOW[(sx + sz + 4) % 6]), 'Fabric', px + sx*0.7, 3.1, pz, 1.3, 0.8, 0.08);
  }
})();
(function(){
  const tx = 95, tz = -25;
  envMesh(boxGeo, rgb([140,135,128]), 'Fabric', tx, 0.3, tz, 10, 0.6, 10); // platform
  const widths = [7, 5.5, 4], heights = [9, 8, 7];
  const tierColors = [[198,190,172],[210,202,184],[222,214,196]];
  let y = 0.6;
  for (let i = 0; i < 3; i++){
    const w = widths[i], h = heights[i];
    envMesh(boxGeo, rgb(tierColors[i]), 'Fabric', tx, y + h/2, tz, w, h, w);
    y += h;
    neonBox(tx, y, tz, w + 0.4, 0.4, w + 0.4, RAINBOW[(i + 3) % 6]); // trim ring
  }
  // warm neon windows + door on the west face (toward the plaza)
  for (const wy of [3.5, 6, 8.5]) neonBox(tx - 3.55, wy, tz, 0.15, 1.2, 0.9, [255,167,87]);
  envMesh(boxGeo, rgb([60,45,35]), 'Fabric', tx - 3.55, 2.1, tz, 0.2, 3, 1.8);
  // glowing cyan beacon orb + the tower's PointLight + gold flag
  neonBall(tx, y + 0.8, tz, 1.6, [140,220,255]);
  halo(tx, y + 0.8, tz, 4.5, [140,220,255]);
  const beacon = new THREE.PointLight(rgb([140,220,255]), 1.0, 24, 1);
  beacon.position.set(tx, y + 0.8, tz); scene.add(beacon);
  envMesh(boxGeo, rgb([110,78,48]), 'Fabric', tx + 1.2, y + 1.5, tz, 0.25, 3, 0.25);
  envMesh(boxGeo, rgb(RAINBOW[1]), 'Fabric', tx + 2.3, y + 2.4, tz, 2.0, 1.2, 0.1);
})();

// dusk lighting for the env views: sun low + warm, sky deep blue to warm
// horizon, so the neon trim and the lamp/string lights actually read.
function setDusk(){
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
  const g = cv.getContext('2d'); const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0, '#2c3e6e'); gr.addColorStop(0.55, '#7a6a9e');
  gr.addColorStop(0.8, '#e8906a'); gr.addColorStop(1, '#ffc98a');
  g.fillStyle = gr; g.fillRect(0,0,4,256);
  scene.background = new THREE.CanvasTexture(cv);
  scene.fog = new THREE.Fog(0x8a7a9e, 90, 220);
  sun.intensity = 0.7; sun.color.set(0xffb070);
  hemi.intensity = 0.45;
}

// ---- views ----
const beltY = 2;
function placeRow(){
  SNACKS.forEach((def, i) => {
    const s = buildSnack(def, beltY);
    s.position.x = -30 + i * 7.5;
    scene.add(s);
  });
}
if (VIEW === 'closeup'){
  const burger = SNACKS.find(s => s.key === 'baron_burger');
  const s = buildSnack(burger, 0); scene.add(s);
  camera.position.set(0, 6.4, 9.5);
  camera.lookAt(0, 5.6, 0.8);
} else if (VIEW === 'snack'){
  const key = params.get('key') || 'soggy_fry';
  const def = SNACKS.find(s => s.key === key) || SNACKS[0];
  document.getElementById('viewname').textContent = 'snack: ' + def.name;
  // Clear ground north of the belt (z=-45: between the tree line and the
  // fountain); the belt at z=0 would block the camera from the front.
  const s = buildSnack(def, 0); s.position.set(0, 0, -45); scene.add(s);
  const h = def.size * 1.1, d = def.size * 2.6;
  camera.position.set(0, h * 0.62, -45 + d);
  camera.lookAt(0, h * 0.45, -45);
} else if (VIEW === 'burger'){
  const burger = SNACKS.find(s => s.key === 'baron_burger');
  const s = buildSnack(burger, 0); scene.add(s);
  camera.position.set(7, 6.5, 13);
  camera.lookAt(0, 4.2, 0);
} else if (VIEW === 'env'){
  // full environment, no snack row: wide shot over the plaza — belt,
  // north + south bases, lamp posts and string lights in frame
  document.getElementById('viewname').textContent = 'env — plaza + bases';
  setDusk();
  camera.position.set(50, 32, 60);
  camera.lookAt(-8, 2, -10);
} else if (VIEW === 'base'){
  // closeup from the belt looking at north base 2 (blue): arch, neon
  // trim, runner and wall crown in frame
  document.getElementById('viewname').textContent = 'base — BASE 2 closeup';
  setDusk();
  camera.position.set(-18, 10.5, 6);
  camera.lookAt(-18, 3.5, -23);
} else if (VIEW === 'carnival'){
  // wide shot from the south-east: ferris wheel (west) + tower (east)
  // with the plaza between them; dusk so the rainbow neon reads.
  // Fog pushed out for this long shot, or the landmarks wash out.
  document.getElementById('viewname').textContent = 'carnival — wheel + tower';
  setDusk();
  scene.fog = new THREE.Fog(0x8a7a9e, 130, 340);
  camera.position.set(48, 36, 132);
  camera.lookAt(0, 11, -5);
} else if (VIEW === 'hero'){
  placeRow();
  camera.position.set(38, 22, 42);
  camera.lookAt(0, 2, -6);
} else { // group (default)
  placeRow();
  // Raised + pulled back from the old (0,10,42): the env-polish pergolas
  // on the south bases (tops ~8) occlude the belt from the old angle, and
  // the row spans x=-30..30, so the camera must sit far enough back to
  // fit all 9. From (0,16,42) the sightline clears the pergolas and the
  // whole row fits.
  camera.position.set(0, 16, 42);
  camera.lookAt(0, 4, 0);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.render(scene, camera);

</script>
